name: Sync open music data

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  dry-run-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sync dependencies
        run: python -m pip install -e "backend"
      - name: Validate sync jobs
        run: python scripts/sync_open_data.py --source all --dry-run
