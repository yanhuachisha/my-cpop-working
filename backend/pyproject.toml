[project]
name = "cpop-atlas-api"
version = "0.1.0"
description = "Open-data C-Pop atlas and daily recommendation agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  "langchain>=1.0.0",
  "langchain-openai>=0.3.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "imageio-ffmpeg>=0.5.1",
  "pycaw>=20251023; platform_system == 'Windows'",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
